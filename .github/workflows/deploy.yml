name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Compilar
        run: npm run build
        env:
          # Configúralas en Settings → Secrets and variables → Actions → Variables.
          # La anon key es pública por diseño (el acceso lo controla RLS en InsForge).
          VITE_INSFORGE_URL: ${{ vars.VITE_INSFORGE_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ vars.VITE_INSFORGE_ANON_KEY }}
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
